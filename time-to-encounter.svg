<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 380" font-family="'Inter', 'Helvetica Neue', sans-serif">
  <defs>
    <linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E6E73"/>
      <stop offset="100%" stop-color="#165B60"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="380" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="24" y="32" font-size="15" font-weight="600" fill="#1A1A1A" letter-spacing="-0.02em">Time to encounter (seconds)</text>
  <text x="24" y="52" font-size="12" fill="#165B60" font-weight="600">8-player baseline: 4.8s</text>

  <!-- Chart area: x=24, y=72, width=352, height=240, bottom at y=312 -->
  <!-- Y-axis gridlines -->
  <line x1="24" y1="312" x2="376" y2="312" stroke="#E4E4E2" stroke-width="1"/>
  <line x1="24" y1="277.7" x2="376" y2="277.7" stroke="#E4E4E2" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="24" y1="243.4" x2="376" y2="243.4" stroke="#E4E4E2" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="24" y1="209.1" x2="376" y2="209.1" stroke="#E4E4E2" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="24" y1="174.9" x2="376" y2="174.9" stroke="#E4E4E2" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="24" y1="140.6" x2="376" y2="140.6" stroke="#E4E4E2" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="24" y1="106.3" x2="376" y2="106.3" stroke="#E4E4E2" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Bars: 5 bars, each 48px wide, gap 22px, starting at x=39 -->
  <!-- Scale: each second = 34.3px -->

  <!-- Proto 1: 3.6s → h=123.5, y=188.5 -->
  <rect x="39" y="188.5" width="48" height="123.5" rx="4" fill="url(#barGrad)"/>
  <text x="63" y="180" font-size="14" font-weight="600" fill="#165B60" text-anchor="middle">3.6s</text>

  <!-- Proto 2: 6.7s → h=229.8, y=82.2 -->
  <rect x="109" y="82.2" width="48" height="229.8" rx="4" fill="url(#barGrad)"/>
  <text x="133" y="74" font-size="14" font-weight="600" fill="#165B60" text-anchor="middle">6.7s</text>

  <!-- Proto 3: 4.1s → h=140.6, y=171.4 -->
  <rect x="179" y="171.4" width="48" height="140.6" rx="4" fill="url(#barGrad)"/>
  <text x="203" y="163" font-size="14" font-weight="600" fill="#165B60" text-anchor="middle">4.1s</text>

  <!-- Proto 4: 4.5s → h=154.4, y=157.7 -->
  <rect x="249" y="157.7" width="48" height="154.3" rx="4" fill="url(#barGrad)"/>
  <text x="273" y="149" font-size="14" font-weight="600" fill="#165B60" text-anchor="middle">4.5s</text>

  <!-- Proto 5: 6.1s → h=209.2, y=102.8 -->
  <rect x="319" y="102.8" width="48" height="209.2" rx="4" fill="url(#barGrad)"/>
  <text x="343" y="95" font-size="14" font-weight="600" fill="#165B60" text-anchor="middle">6.1s</text>

  <!-- X-axis labels -->
  <text x="63" y="334" font-size="13" fill="#5C5C5C" text-anchor="middle">Proto 1</text>
  <text x="133" y="334" font-size="13" fill="#5C5C5C" text-anchor="middle">Proto 2</text>
  <text x="203" y="334" font-size="13" fill="#5C5C5C" text-anchor="middle">Proto 3</text>
  <text x="273" y="334" font-size="13" fill="#5C5C5C" text-anchor="middle">Proto 4</text>
  <text x="343" y="334" font-size="13" fill="#5C5C5C" text-anchor="middle">Proto 5</text>
</svg>
